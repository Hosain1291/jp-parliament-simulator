<meta name="description" content="1996–2026 일본 중의원 총선을 내 입장으로 다시 치르는 시뮬레이터. 반원 의석, 내각총리대신 지명선거, 도도부현 지도.">

<body>
<!--APP-->
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 30 24" aria-hidden="true"><path d="M3 22h24M6 22v-8M10 22v-8M14 22v-8M16 22v-8M20 22v-8M24 22v-8M4 14h22M7 14l8-5 8 5M13 9V5h4v4M15 5V2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>중의원 시뮬레이터<small>衆議院 · 1996 — 2026</small></div>
    </div>
    <div class="topr">
      <div class="skin" id="skin" role="group" aria-label="테마">
        <button type="button" data-skin="auto">자동</button>
        <button type="button" data-skin="light"><i style="background:#f1f2f5"></i>라이트</button>
        <button type="button" data-skin="dark"><i style="background:#181b21"></i>다크</button>
        <button type="button" data-skin="pink"><i style="background:#7B1C4F"></i>핑크</button>
        <button type="button" data-skin="paper"><i style="background:#d9c49a"></i>올드 페이퍼</button>
        <button type="button" data-skin="win95"><i style="background:#008080;border-color:#c0c0c0"></i>윈도우 95</button>
      </div>
      <button type="button" class="link" id="toHome" hidden>총선 다시 고르기</button>
    </div>
  </div>
  <main id="app"></main>
  <p class="foot">질문과 정당 위치는 각 총선의 대표 쟁점을 단순화한 것으로, 실제 당론·표결과 다를 수 있습니다. 무소속은 한 묶음으로 계산하고 비례 의석은 받지 않습니다. 비례대표는 11개 블록 대신 전국 단위로 계산합니다. 정당 색은 위키백과 정당색을 따랐고, 확인하지 못한 일부는 근사값입니다. 도도부현 지도는 <a href="https://github.com/Hosain1291/jp-parliament-simulator/blob/main/jp.json" target="_blank" rel="noopener">jp.json</a>(simplemaps)을 썼습니다.</p>
